<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>淺水鯊製作所</title>
  <meta name="description" content="喜歡新奇有趣的想法或內容，想把這些美好分享給好多人知道。本業是數學教育。">

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shallowshark0219.github.io/">
  <meta property="og:title" content="淺水鯊製作所">
  <meta property="og:description" content="喜歡新奇有趣的想法或內容，想把這些美好分享給好多人知道。本業是數學教育。">
  <meta property="og:image" content="https://shallowshark0219.github.io/images/og.png">

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <style>
    :root {
      --navy: #285889;
      --blue: #2e94d6;
      --orange: #f37138;
      --paper: #fdfbf7;
      --ink: #1f2d3d;
      --muted: #5b6b7c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.7;
    }

    main {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .logo {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.75rem;
      color: var(--navy);
      letter-spacing: 0.08em;
    }

    .bio {
      margin: 0 0 32px;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: block;
      padding: 14px 20px;
      border: 2px solid var(--navy);
      border-radius: 999px;
      color: var(--navy);
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--navy);
      color: #fff;
    }

    .links small {
      font-weight: 400;
      opacity: 0.75;
      margin-left: 6px;
    }

    footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="images/logo.png" alt="淺水鯊製作所 logo" width="200" height="200">
    <h1>淺水鯊製作所</h1>
    <p class="bio">喜歡新奇有趣的想法或內容，<br>想把這些美好分享給好多人知道。<br>本業是數學教育。</p>

    <nav class="links">
      <a href="https://www.instagram.com/shark._.0219/">Instagram<small>@shark._.0219</small></a>
      <a href="https://www.facebook.com/shallowshark0219">Facebook<small>淺水鯊製作所</small></a>
    </nav>

    <footer>© 2026 淺水鯊製作所</footer>
  </main>
</body>
</html>
